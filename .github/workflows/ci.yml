name: Quasar checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npm run export:web
        env:
          EXPO_NO_TELEMETRY: '1'
